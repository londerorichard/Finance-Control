{% extends "base.html" %}

{% block extra_css %}
<link rel="stylesheet" href="/app/static/css/transaction.css">
{% endblock %}

{% block content %}
<div class="main-container">

    <div class="transactions-container">

        <ul class="transactions-list">

            <!-- <template id="transactions-category-template"> -->

                <li class="transaction">     
                    <div class="transaction-main">         
                        <div class="transaction-icon"><!-- Category SVG icon --></div>

                        <div class="transaction-info">
                            <span class="category-name">Food</span>
                            <span class="transaction-account">Credit Card</span>
                        </div>

                        <div class="transaction-value">
                            <span class="transaction-expense negative">- $37,90</span>
                            <span class="transaction-day-time">Yesterday, 14:57</span>
                        </div>
                    </div>

                </li>
                
            <!-- </template> -->

        </ul>

    </div>

</div>
{% endblock %}

{% block extra_js %}
<script src="https://unpkg.com/lucide@latest"></script>
<script src="/app/static/javascript/transactions-js.js"></script>
{% endblock %}
